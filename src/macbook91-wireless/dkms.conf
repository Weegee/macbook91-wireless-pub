PACKAGE_NAME="macbook91-wireless"
PACKAGE_VERSION="@PKGVER@"

# The Makefile builds the series of the target kernel and copies the five
# modules to build/, so the locations do not depend on the series.
#
# The modules keep their in-tree names so that, installed under
# /lib/modules/<kver>/updates/, depmod prefers them over the stock drivers.
# Removing this DKMS module and running depmod restores the stock drivers.
BUILT_MODULE_NAME[0]="brcmfmac"
BUILT_MODULE_LOCATION[0]="build/"
DEST_MODULE_LOCATION[0]="/updates"
BUILT_MODULE_NAME[1]="brcmfmac-wcc"
BUILT_MODULE_LOCATION[1]="build/"
DEST_MODULE_LOCATION[1]="/updates"
BUILT_MODULE_NAME[2]="brcmfmac-cyw"
BUILT_MODULE_LOCATION[2]="build/"
DEST_MODULE_LOCATION[2]="/updates"
BUILT_MODULE_NAME[3]="brcmfmac-bca"
BUILT_MODULE_LOCATION[3]="build/"
DEST_MODULE_LOCATION[3]="/updates"
BUILT_MODULE_NAME[4]="hci_uart"
BUILT_MODULE_LOCATION[4]="build/"
DEST_MODULE_LOCATION[4]="/updates"

MAKE[0]="make KDIR=/lib/modules/${kernelver}/build PKGVER=${PACKAGE_VERSION}"

AUTOINSTALL="yes"

# The sources carry the kernel series listed in KERNEL-SERIES (written by
# packaging/fetch-upstream.sh; make install turns the list into the pattern
# below through /usr/lib/macbook91-wireless/kernel-series --dkms-regex, which
# the pacman hook and the verifier ask as well). Other kernels keep their
# stock drivers and DKMS skips them instead of failing.
BUILD_EXCLUSIVE_KERNEL="@SERIES_RE@"
