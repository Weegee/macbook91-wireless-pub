#
# macbook91-wireless: brcmfmac options for the MacBook9,1 (BCM4350).
#
# feature_disable=0x10 turns off Wi-Fi P2P (Wi-Fi Direct, bit 4 of brcmfmac's
# feature list). With P2P on, wpa_supplicant and NetworkManager create a
# p2p-dev-wlan0 interface whose registrations the driver does not support,
# which fills the journal with errors on every connect and resume, and the
# firmware runs an extra P2P discovery interface. Infrastructure WLAN, AP mode,
# WoWLAN and multi-channel are unaffected.
#
# To use Wi-Fi Direct (e.g. Miracast), override it with a file of the same
# name, /etc/modprobe.d/macbook91-wireless.conf, which replaces this one:
#   options brcmfmac feature_disable=0
# and reload brcmfmac (sudo macbook91-wireless-verify --reload) or reboot. A
# file with another name counts only if it sorts after this one: modprobe
# reads all files in lexical order, and the last feature_disable wins.
options brcmfmac feature_disable=0x10
