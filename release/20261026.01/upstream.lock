# SPDX-License-Identifier: GPL-3.0-or-later
#
# Hashes of every file the build takes from outside this repository, and of
# the tree derived from them.
#
#   <tag>  <sha256>  <path in the kernel tree | derived:tree>
#
# packaging/fetch-upstream.sh refuses to build from a (tag, path) pair it does
# not find here and fails hard, with no override, when a pair it does find has
# different bytes. derived:tree is the hash of UPSTREAM.sha256, the manifest of
# the assembled tree (fetched files with patches/ applied, the Kbuild
# overlays, the patches themselves and KERNEL-SERIES/KERNEL-TAG), so any change
# to a patch or an overlay changes it too and has to be recorded here.
#
# A new tag is added by running the fetcher with --accept-new and committing
# the new lines after review.
#
# v7.2.9 seeded 2026-10-13 from git.kernel.org stable; the fetched files are
# byte-identical to the sparse checkout the patches were developed on.
#
# v6.18.55 added 2026-10-20 (LTS series, fetched from git.kernel.org stable).
#
# 2026-10-26: one patch set for every series (patches/, the former 7.2 set);
# the 6.18 set it replaced differed in hunk line numbers, index and From lines
# only. The derived:tree of v6.18.55 changed with the copy of the patches in
# its manifest; its kernel/ tree is byte for byte the same as before.
#
# v7.3 added 2026-10-26 for the CachyOS kernel 7.3.0-4, which is Linux 7.3.0
# (no v7.3.Z stable tag existed yet); fetched from git.kernel.org stable. 95 of
# the 96 files are byte-identical to CachyOS's kernel tree at tag
# cachyos-7.3.0-4. brcmfmac/pcie.c differs in brcmf_pcie_pm_enter_D3 only
# (CachyOS: no -EIO on a missing D3 acknowledgement without WoWLAN), a path
# that patch 0003 handles itself. The one patch set applies with -F0.

